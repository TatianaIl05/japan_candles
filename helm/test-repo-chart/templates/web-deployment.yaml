apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.web.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.web.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.web.name }}
    spec:
      serviceAccountName: web-sa
      containers:
      - name: web
        image: {{ .Values.web.image }}
        ports:
        - containerPort: 80